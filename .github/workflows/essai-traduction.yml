name: Essai réel (traduction)
on:
  push:
    branches: [claude/project-thread-a9v28q]
    paths: ["essai-reel/traduction.json", "essai-reel/traduction.mjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node essai-reel/traduction.mjs
