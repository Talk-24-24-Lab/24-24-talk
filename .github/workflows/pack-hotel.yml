name: Pack Hôtel 112 langues
# Lancé en modifiant pack-hotel/demande.json : {"langues": "sw yo", "lots": "0 1 2 3", "mode": "aller" | "retour"}
on:
  push:
    branches: [claude/project-thread-a9v28q]
    paths: ["pack-hotel/demande.json"]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: pack-hotel }
      - id: m
        run: |
          python3 -c "
          import json
          d=json.load(open('pack-hotel/demande.json'))
          print('m='+json.dumps({'include':[{'l':l,'t':t,'mode':d.get('mode','aller')} for l in d['langues'].split() for t in d.get('lots','0 1 2 3').split()]}))" >> $GITHUB_OUTPUT
  trad:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: pack-hotel }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node pack-hotel/robot.mjs ${{ matrix.l }} ${{ matrix.t }} 4 ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        with: { name: "hotel-${{ matrix.l }}-${{ matrix.t }}-${{ matrix.mode }}", path: resultats/ }
  recolte:
    needs: trad
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: "hotel-*", merge-multiple: true }
      - run: |
          mkdir -p pack-hotel/resultats
          cp art/*.json pack-hotel/resultats/ 2>/dev/null || true
          git config user.name "robot-pack-hotel"; git config user.email "robot@users.noreply.github.com"
          git add pack-hotel/resultats
          git commit -qm "Pack Hôtel : résultats du robot (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin claude/project-thread-a9v28q && git push -q origin HEAD:claude/project-thread-a9v28q && break; sleep 5; done
