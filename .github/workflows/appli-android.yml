name: Appli Android (APK)
on:
  push:
    branches: [claude/project-thread-a9v28q]
    paths: ["app-android/**", ".github/workflows/appli-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Préparer le projet Android (Capacitor)
        working-directory: app-android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash native/patch.sh
          npx cap sync android
      - name: Construire l'APK
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - name: Activer KVM pour le téléphone virtuel
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Essai sur un téléphone Android virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash app-android/native/essai-emulateur.sh
      - name: Résultat de l'essai
        run: cat essai-resultats.json; tail -30 essai-logcat.txt || true
      - name: Publier l'APK (lien de téléchargement direct)
        run: |
          cp app-android/android/app/build/outputs/apk/debug/app-debug.apk one-world.apk
          node -e "const r=require('./essai-resultats.json'); if(!r.ok){console.log('Essai raté : APK non publié'); process.exit(1)}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: 24/24 ONE WORLD pour Android
          body: "Application Android de 24/24 ONE WORLD (version d'essai). Téléchargez one-world.apk sur le téléphone, puis ouvrez-le pour l'installer."
          files: |
            one-world.apk
            essai-ecran.png
          make_latest: true
