name: Analyse de l'APK publié
on:
  push:
    branches: [claude/project-thread-a9v28q]
    paths: ["app-android/analyse/demande.txt", ".github/workflows/analyse-apk.yml"]
jobs:
  fichier:
    runs-on: ubuntu-latest
    steps:
      - name: Contrôle du fichier (signature, alignement, versions d'Android)
        run: |
          curl -sL -o ow.apk https://github.com/Talk-24-24-Lab/24-24-talk/releases/download/android/one-world.apk
          ls -la ow.apk; sha256sum ow.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          $BT/apksigner verify -v --print-certs ow.apk || echo "APKSIGNER ÉCHEC"
          $BT/zipalign -c -P 16 -v 4 ow.apk | tail -3 || echo "ZIPALIGN ÉCHEC"
          $BT/aapt2 dump badging ow.apk | grep -E "package:|sdkVersion|targetSdk|native-code|testOnly|debuggable|application-debuggable" || true
          $BT/aapt2 dump xmltree ow.apk --file AndroidManifest.xml | grep -iE "testOnly|debuggable|minSdk|targetSdk|extractNativeLibs" || true
          unzip -l ow.apk | grep -E "\.so$|lib/" | head || echo "pas de bibliothèque native"
  installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 34, 35]
    steps:
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: curl -sL -o ow.apk https://github.com/Talk-24-24-Lab/24-24-talk/releases/download/android/one-world.apk
      - name: Installer comme le ferait le téléphone (installateur de paquets)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 34 && 'google_apis' || 'default' }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb push ow.apk /data/local/tmp/ow.apk
            adb shell pm install -r /data/local/tmp/ow.apk && echo "INSTALL API ${{ matrix.api }} : OK" || echo "INSTALL API ${{ matrix.api }} : ÉCHEC"
            adb shell dumpsys package com.oneworld2424.app | grep -E "versionName|versionCode|targetSdk|minSdk|flags=" | head -5
