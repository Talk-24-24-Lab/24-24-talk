# 24/24 ONE WORLD — © 2026 Sébastien Chevrier. Teste la traduction réelle dans les 112 langues (voir tests/langues/LISEZMOI.md).
name: Test des 112 langues
on:
  workflow_dispatch:
    inputs:
      moteur:
        description: "Moteur à tester (google = les 112 langues d'un coup ; mymemory = 20 langues par jour)"
        type: choice
        options: [google, mymemory]
        default: google
      lot:
        description: "Lot de 20 langues (1 à 6). Laisser vide = toutes les langues."
        required: false
        default: ""
      langues:
        description: "Ou une liste de codes séparés par des virgules (ex. mg,sw,ht). Prioritaire sur le lot."
        required: false
        default: ""
permissions:
  contents: read
jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Traduire les phrases types et faire l'aller-retour
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          GOOGLE_TRANSLATE_KEY: ${{ secrets.GOOGLE_TRANSLATE_KEY }}
          MOTEUR: ${{ github.event.inputs.moteur }}
          LANGUES: ${{ github.event.inputs.langues }}
          LOT: ${{ github.event.inputs.lot }}
        run: |
          OPT="--moteur=$MOTEUR"
          if [ -n "$LANGUES" ]; then OPT="$OPT --langues=$LANGUES"; elif [ -n "$LOT" ]; then OPT="$OPT --lot=$LOT"; fi
          node tests/langues/tester-moteur.mjs $OPT || [ $? -eq 3 ]
      - name: Résumé dans la page du test
        if: always()
        run: cat tests/langues/resultats/resume-*.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Grille à télécharger (CSV pour les relecteurs natifs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-langues
          path: tests/langues/resultats/
