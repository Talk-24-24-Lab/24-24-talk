name: Essai réel (base de TEST)
on:
  push:
    branches: [claude/project-thread-a9v28q]
    paths: ["essai-reel/essai.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save @supabase/supabase-js@2.45.4
      - run: node essai-reel/run.mjs
