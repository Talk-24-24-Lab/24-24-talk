<!doctype html>
<!--
  24/24 ONE WORLD — adresse courte de WORLD BRIDGE (liens d'invitation : …/everywhere/oneworld/?de=fr&vers=en).

  Ce n'est PAS une deuxième application : la page renvoie aussitôt vers la porte du portail (../#/bridge), en gardant
  les deux langues de l'invitation. Même manifeste, même service worker, même compte que le reste de ONE WORLD.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24/24 ONE WORLD · WORLD BRIDGE</title>
<meta name="description" content="Vous ne parlez pas la même langue ? Parlez quand même. Ouvrez le lien : vos deux langues sont déjà choisies, aucun compte n'est demandé.">
<meta property="og:title" content="Vous ne parlez pas la même langue ? Parlez quand même.">
<meta property="og:description" content="24/24 ONE WORLD · WORLD BRIDGE : touchez pour ouvrir. Gratuit, sans compte.">
<meta name="theme-color" content="#1f5fe0">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f8ff;color:#0d1733;
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border-radius:14px;background:#1f5fe0;color:#fff;font-weight:800;text-decoration:none;}
  @media (prefers-color-scheme: dark){body{background:#050913;color:#eef3ff;}}</style>
<script>
  // Seuls les paramètres connus sont transmis (langues et pseudo) ; tout le reste est ignoré.
  (function () {
    var q = location.search || "", keep = [];
    ["de", "vers", "p"].forEach(function (k) {
      var m = new RegExp("[?&]" + k + "=([A-Za-z0-9_.-]{2,20})(?:&|$)").exec(q);
      if (m) keep.push(k + "=" + m[1]);
    });
    location.replace("../" + (keep.length ? "?" + keep.join("&") : "") + "#/bridge");
  })();
</script>
</head>
<body>
<p><a href="../#/bridge">Ouvrir WORLD BRIDGE</a></p>
</body>
</html>
